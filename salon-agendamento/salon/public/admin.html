<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Lumière Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin-body">

<!-- ── LOGIN ──────────────────────────────────────────────────── -->
<div class="admin-login" id="loginView">
  <div class="admin-login-card">
    <div class="nav-logo" style="text-align:center;margin-bottom:2rem">
      Lumière<span>Studio</span>
    </div>
    <h2>Painel Admin</h2>
    <div class="form-group">
      <label for="loginUser">Usuário</label>
      <input type="text" id="loginUser" placeholder="admin" autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="loginPass">Senha</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
      <span class="field-error" id="loginError"></span>
    </div>
    <button class="btn-primary btn-full" id="loginBtn">
      <span>Entrar</span>
    </button>
    <p style="margin-top:1.5rem;text-align:center;font-size:.8rem">
      <a href="/" style="color:var(--rose);text-decoration:none">← Voltar ao site</a>
    </p>
  </div>
</div>

<!-- ── PANEL ───────────────────────────────────────────────────── -->
<div class="admin-panel" id="adminPanel">
  <div class="admin-header">
    <div class="nav-logo">Lumière<span style="color:var(--rose)">Studio</span> <small style="opacity:.5;font-size:.7rem;margin-left:.5rem">Admin</small></div>
    <div style="display:flex;gap:.75rem;align-items:center">
      <a href="/" style="font-size:.72rem;color:rgba(248,244,239,.5);text-decoration:none;letter-spacing:.08em">Ver site</a>
      <button class="btn-logout" id="logoutBtn">Sair</button>
    </div>
  </div>

  <div class="admin-content">
    <!-- Tabs -->
    <div style="display:flex;gap:.5rem;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:0">
      <button class="tab-btn active" data-tab="appointments" onclick="switchTab('appointments')">Agendamentos</button>
      <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">Configurações</button>
    </div>

    <!-- Appointments tab -->
    <div id="tabAppointments">
      <h2 class="admin-title">Agendamentos</h2>

      <div class="admin-stats" id="adminStats">
        <div class="stat-card">
          <strong id="statTotal">—</strong>
          <span>Total hoje</span>
        </div>
        <div class="stat-card">
          <strong id="statConfirmado">—</strong>
          <span>Confirmados</span>
        </div>
        <div class="stat-card">
          <strong id="statCancelado">—</strong>
          <span>Cancelados</span>
        </div>
      </div>

      <div class="admin-filters">
        <input type="date" id="filterDate" placeholder="Filtrar por data" />
        <select id="filterStatus">
          <option value="">Todos os status</option>
          <option value="confirmado">Confirmado</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <button class="btn-secondary" onclick="loadAppointments()" style="padding:.55rem 1.2rem;font-size:.78rem">Filtrar</button>
        <button class="btn-secondary" onclick="clearFilters()" style="padding:.55rem 1.2rem;font-size:.78rem">Limpar</button>
      </div>

      <div id="appointmentsContainer">
        <p class="empty-state">Carregando agendamentos...</p>
      </div>
    </div>

    <!-- Settings tab -->
    <div id="tabSettings" style="display:none">
      <h2 class="admin-title">Configurações</h2>

      <div style="background:#fff;padding:2rem;max-width:500px;box-shadow:var(--shadow)">
        <div class="form-group">
          <label>Número do WhatsApp do Salão</label>
          <input type="tel" id="salonPhone" placeholder="5511999999999 (só números)" />
          <small style="color:var(--text-muted);font-size:.75rem">Formato: código do país + DDD + número (ex: 5511999999999)</small>
        </div>

        <hr style="margin:1.5rem 0;border:none;border-top:1px solid var(--border)">

        <p style="font-size:.8rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin-bottom:1rem;color:var(--charcoal-light)">Alterar senha</p>

        <div class="form-group">
          <label>Senha atual</label>
          <input type="password" id="currentPass" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label>Nova senha</label>
          <input type="password" id="newPass" placeholder="••••••••" />
        </div>

        <span class="field-error" id="settingsError"></span>

        <button class="btn-primary" style="margin-top:.5rem" onclick="saveSettings()">
          <span>Salvar configurações</span>
        </button>
      </div>
    </div>
  </div>
</div>

<style>
.tab-btn {
  padding: .6rem 1.5rem;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  font-family: var(--font-body);
  font-size: .78rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  transition: var(--transition);
  margin-bottom: -1px;
}
.tab-btn.active {
  color: var(--charcoal);
  border-bottom-color: var(--rose);
}
.tab-btn:hover { color: var(--charcoal); }
</style>

<script src="admin.js"></script>
</body>
</html>
